<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holly Bonnel — MELT Method</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:   #0e2240;
  --blue:   #2a5298;
  --muted:  #4a6fa5;
  --sage:   #7a9e8e;
  --dawn:   #ede6db;
  --sand:   #f5f0e8;
  --white:  #ffffff;
  --ink:    #1a1a1a;
  --body:   #3d3d3d;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  color: var(--ink);
  background: var(--white);
  overflow-x: hidden;
}

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 48px;
  transition: background 0.4s, padding 0.3s;
}
nav.scrolled {
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(8px);
  padding: 14px 48px;
  border-bottom: 1px solid rgba(0,0,0,0.06);
}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
}
.nav-logo svg { width: 32px; }
.nav-logo-text {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.18em;
  color: var(--navy);
  line-height: 1.3;
}
.nav-cta {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.06em;
  color: var(--navy);
  text-decoration: none;
  padding: 8px 20px;
  border: 1px solid var(--navy);
  border-radius: 1px;
  transition: background 0.2s, color 0.2s;
}
.nav-cta:hover { background: var(--navy); color: var(--white); }

/* ── HERO ── */
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
  background: var(--sand);
}

/* Atmospheric dawn light — radial glow from top right */
.hero::before {
  content: '';
  position: absolute;
  top: -20%;
  right: -10%;
  width: 80vw;
  height: 80vw;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(200,218,240,0.55) 0%, rgba(232,221,208,0.3) 40%, transparent 70%);
  pointer-events: none;
}

/* Second soft light pool bottom left */
.hero::after {
  content: '';
  position: absolute;
  bottom: -15%;
  left: -5%;
  width: 55vw;
  height: 55vw;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(122,158,142,0.18) 0%, transparent 65%);
  pointer-events: none;
}

.hero-inner {
  position: relative;
  z-index: 2;
  max-width: 680px;
  margin: 0 auto;
  padding: 0 48px;
  width: 100%;
  text-align: center;
}

.hero-tag {
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.16em;
  color: var(--sage);
  margin-bottom: 32px;
}

.hero-headline {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(52px, 8vw, 100px);
  line-height: 0.95;
  letter-spacing: -0.01em;
  margin-bottom: 44px;
  color: var(--navy);
}

.hero-headline em {
  font-style: italic;
  background: linear-gradient(135deg, var(--blue) 0%, var(--muted) 50%, var(--sage) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-actions {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
}

.btn-primary {
  display: inline-block;
  background: var(--navy);
  color: var(--white);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.08em;
  padding: 16px 36px;
  border: none;
  border-radius: 1px;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.2s;
}
.btn-primary:hover { background: var(--blue); }

.btn-secondary {
  display: inline-block;
  background: transparent;
  color: var(--navy);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.08em;
  padding: 15px 36px;
  border: 1px solid rgba(14,34,64,0.35);
  border-radius: 1px;
  cursor: pointer;
  text-decoration: none;
  transition: border-color 0.2s, color 0.2s;
}
.btn-secondary:hover { border-color: var(--navy); }

/* Floating logo shape — decorative right side */
.hero-shape {
  position: absolute;
  right: 6%;
  top: 50%;
  transform: translateY(-50%);
  width: min(38vw, 460px);
  opacity: 0.12;
  pointer-events: none;
}


/* ── MODAL ── */
.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(14,34,64,0.6);
  backdrop-filter: blur(4px);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-backdrop.open { display: flex; }

.modal {
  background: var(--white);
  width: 100%;
  max-width: 460px;
  padding: 52px 48px;
  position: relative;
  animation: modalIn 0.25s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
.modal-close {
  position: absolute;
  top: 20px; right: 20px;
  background: none; border: none;
  font-size: 20px; cursor: pointer;
  color: #aaa; line-height: 1;
  padding: 4px 8px;
  transition: color 0.15s;
}
.modal-close:hover { color: var(--ink); }
.modal-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px;
  font-weight: 300;
  color: var(--navy);
  margin-bottom: 10px;
}
.modal-sub {
  font-size: 14px;
  color: #888;
  line-height: 1.65;
  margin-bottom: 36px;
}
.modal-field {
  display: flex;
  flex-direction: column;
  margin-bottom: 20px;
}
.modal-field label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
  color: #999;
  margin-bottom: 6px;
}
.modal-field input {
  border: none;
  border-bottom: 1px solid #d0d0d0;
  padding: 6px 0;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  font-weight: 300;
  color: var(--ink);
  background: transparent;
  outline: none;
  transition: border-color 0.15s;
}
.modal-field input:focus { border-bottom-color: var(--navy); }
.modal-submit {
  width: 100%;
  background: var(--navy);
  color: var(--white);
  border: none;
  padding: 14px;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.08em;
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.2s;
  border-radius: 1px;
}
.modal-submit:hover { background: var(--blue); }
.modal-submit:disabled { background: #aaa; cursor: default; }
.modal-success {
  display: none;
  text-align: center;
  padding: 20px 0;
}
.modal-success p {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 300;
  color: var(--navy);
  margin-bottom: 8px;
}
.modal-success small { font-size: 13px; color: #888; }

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  nav { padding: 18px 28px; }
  nav.scrolled { padding: 12px 28px; }
  .hero-inner { padding: 0 28px; }
  .hero-shape { display: none; }
  .modal { padding: 40px 28px; }
}

@media (max-width: 600px) {
  .hero-actions { flex-direction: column; align-items: center; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>

      <button class="modal-submit" id="reg-submit" onclick="submitInterest()">Send</button>
    </div>
    <div class="modal-success" id="modal-success">
      <p>Thank you.</p>
      <small>Holly will be in touch with you shortly.</small>
    </div>
  </div>
</div>

<script>
// ── Nav scroll behaviour ──────────────────────────────
window.addEventListener('scroll', () => {
  document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 40);
});

// ── Modal ─────────────────────────────────────────────
function openModal() {
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}
function handleBackdropClick(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── Interest form submission ───────────────────────────
// Replace this URL with your Google Apps Script URL (same one as the intake form,
// or a separate one — the script can handle both via a 'type' field)
const SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';

async function submitInterest() {
  const name  = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  if (!name || !email) return;

  const btn = document.getElementById('reg-submit');
  btn.textContent = 'Sending…';
  btn.disabled = true;

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'interest', name, email })
    });
    document.getElementById('modal-form-content').style.display = 'none';
    document.getElementById('modal-success').style.display = 'block';
  } catch {
    btn.textContent = 'Send';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
